server:
  port: 8080

spring:
  application:
    name: guardians-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/guardians_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:gemi123123}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret: ${JWT_SECRET:MpXsCTN6eeB7x6GHoADvnSSQIYFUpNB4tcLQpVkd+PFOEzbr+grA/UfNsJXd7dVyngyGxcL77pv4EsQoaoubBA==}
  expiration-ms: 2592000000

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}

pairing:
  code-expiry-minutes: 5

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.guardians: DEBUG
    org.springframework.security: WARN
    org.flywaydb: INFO
